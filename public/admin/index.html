<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Builder - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.7/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body x-data="app()" x-init="init()">
  <!-- Sidebar -->
  <aside class="sidebar" :class="{ 'collapsed': sidebarCollapsed }" x-show="!showLogin && !showSetup">
    <div class="sidebar-header">
      <h1 class="logo">🏗️ Website Builder</h1>
      <button class="btn-icon" @click="sidebarCollapsed = !sidebarCollapsed" title="Menu in/uitklappen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
    </div>
    
    <nav class="sidebar-nav">
      <template x-for="item in navItems" :key="item.id">
        <a 
          href="#" 
          class="nav-item" 
          :class="{ active: currentView === item.id }"
          @click.prevent="switchView(item.id)"
          :title="sidebarCollapsed ? item.label : ''"
        >
          <span class="nav-icon" x-html="item.icon"></span>
          <span class="nav-label" x-show="!sidebarCollapsed" x-text="item.label"></span>
        </a>
      </template>
    </nav>
    
    <div class="sidebar-footer" x-show="!sidebarCollapsed">
      <div class="user-info">
        <span x-text="user?.email"></span>
      </div>
      <button class="btn btn-secondary btn-sm" @click="logout">Uitloggen</button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content" :class="{ 'sidebar-collapsed': sidebarCollapsed }">
    <!-- Top bar -->
    <header class="topbar" x-show="!showLogin && !showSetup">
      <div class="topbar-left">
        <h2 x-text="currentProject?.name || 'Geen project geselecteerd'"></h2>
      </div>
      <div class="topbar-right">
        <select class="select" v-model="currentProjectId" @change="switchProject($event.target.value)" x-show="projects.length > 0">
          <option value="">Kies project...</option>
          <template x-for="p in projects" :key="p.id">
            <option :value="p.id" x-text="p.name"></option>
          </template>
        </select>
        <button class="btn btn-primary" @click="showCreateProject = true">Nieuw project</button>
      </div>
    </header>

    <!-- Content area -->
    <div class="content-area">
      <!-- Project selector (when no project selected) -->
      <div class="project-selector" x-show="!currentProjectId && !showCreateProject && projects.length > 0">
        <h2>Je projecten</h2>
        <div class="project-grid">
          <template x-for="p in projects" :key="p.id">
            <div class="project-card" @click="selectProject(p.id)">
              <div class="project-card-header">
                <h3 x-text="p.name"></h3>
                <span class="badge" :class="p.template" x-text="p.template"></span>
              </div>
              <p class="project-meta" x-text="`${p.page_count} pagina's • ${p.media_count} media`"></p>
              <div class="project-actions">
                <button class="btn btn-sm" @click.stop="editProject(p)">Bewerken</button>
                <button class="btn btn-primary btn-sm" @click.stop="selectProject(p.id)">Openen</button>
              </div>
            </div>
          </template>
        </div>
        <button class="btn btn-primary" @click="showCreateProject = true">Nieuw project aanmaken</button>
      </div>

      <!-- Create project modal -->
      <div class="modal-overlay" x-show="showCreateProject" @click.self="showCreateProject = false">
        <div class="modal">
          <h2>Nieuw project aanmaken</h2>
          <form @submit.prevent="createProject">
            <div class="form-group">
              <label>Naam</label>
              <input type="text" x-model="newProject.name" required maxlength="100">
            </div>
            <div class="form-group">
              <label>Slug (URL)</label>
              <input type="text" x-model="newProject.slug" required maxlength="100" pattern="[a-z0-9-]+">
            </div>
            <div class="form-group">
              <label>Beschrijving</label>
              <textarea x-model="newProject.description" maxlength="500" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Template</label>
              <select x-model="newProject.template">
                <option value="blank">Leeg</option>
                <option value="business">Bedrijf</option>
                <option value="portfolio">Portfolio</option>
                <option value="restaurant">Restaurant</option>
                <option value="landing">Landing page</option>
              </select>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn btn-secondary" @click="showCreateProject = false">Annuleren</button>
              <button type="submit" class="btn btn-primary">Aanmaken</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Project views -->
      <div x-show="currentProjectId && currentView" x-cloak>
        <template x-if="currentView === 'overview'">
          <div x-html="overviewContent"></div>
        </template>
        <template x-if="currentView === 'pages'">
          <div x-html="pagesContent"></div>
        </template>
        <template x-if="currentView === 'builder'">
          <div x-html="builderContent"></div>
        </template>
        <template x-if="currentView === 'media'">
          <div x-html="mediaContent"></div>
        </template>
        <template x-if="currentView === 'navigation'">
          <div x-html="navigationContent"></div>
        </template>
        <template x-if="currentView === 'design'">
          <div x-html="designContent"></div>
        </template>
        <template x-if="currentView === 'settings'">
          <div x-html="settingsContent"></div>
        </template>
        <template x-if="currentView === 'preview'">
          <div x-html="previewContent"></div>
        </template>
        <template x-if="currentView === 'export'">
          <div x-html="exportContent"></div>
        </template>
      </div>
    </div>
  </main>

  <!-- Login screen -->
  <div class="auth-screen" x-show="showLogin" x-cloak>
    <div class="auth-card">
      <h1>🏗️ Website Builder</h1>
      <h2>Inloggen</h2>
      <form @submit.prevent="login">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" x-model="loginForm.email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" x-model="loginForm.password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" :disabled="loading">Inloggen</button>
        <p v-if="loginError" class="error" x-text="loginError"></p>
      </form>
    </div>
  </div>

  <!-- Setup screen -->
  <div class="auth-screen" x-show="showSetup" x-cloak>
    <div class="auth-card">
      <h1>🏗️ Website Builder</h1>
      <h2>Eerste installatie</h2>
      <p>Maak je admin account aan om te beginnen.</p>
      <form @submit.prevent="setup">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" x-model="setupForm.email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Wachtwoord</label>
          <input type="password" x-model="setupForm.password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Bevestig wachtwoord</label>
          <input type="password" x-model="setupForm.confirmPassword" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" :disabled="loading">Account aanmaken</button>
        <p v-if="setupError" class="error" x-text="setupError"></p>
      </form>
    </div>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
